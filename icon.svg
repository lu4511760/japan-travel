<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="斑尾滑雪 × 東京">
  <!-- 夜色底 -->
  <rect width="64" height="64" rx="14" fill="#16202b"/>
  <!-- 落日 -->
  <circle cx="45" cy="19" r="7.5" fill="#e58a4e"/>
  <!-- 雪山稜線 -->
  <path d="M2 54 L21 21 L33 41 L40 30 L62 54 Z" fill="#eef4f8"/>
  <!-- 背光面，讓兩座山分得出來 -->
  <path d="M21 21 L13.5 34 L28.5 34 Z" fill="#c6d4e0"/>
  <path d="M40 30 L34.5 39 L45.5 39 Z" fill="#c6d4e0"/>
  <!-- 雪花 -->
  <g stroke="#eef4f8" stroke-width="1.6" stroke-linecap="round">
    <path d="M14 13 v7 M10.6 15 l6.8 3 M10.6 18 l6.8 -3"/>
  </g>
</svg>
