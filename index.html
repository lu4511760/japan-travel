<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1814" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fcfbf7" media="(prefers-color-scheme: light)">
<title>斑尾滑雪 × 東京</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#fcfbf7; --fg:#231f1a; --muted:#8a8379; --line:#e8e3d8;
  --rail:#d8d2c4; --accent:#b3541e; --accent-soft:#f9ece2; --link:#1667d9; --meal:#0e7a52; --day:#c2185b; --alert:#d32f2f; --priv:#7b4fb5;
  --dot-bg:#fcfbf7; --card:#ffffff;
  --shadow:0 1px 2px rgba(35,31,26,.06), 0 3px 10px rgba(35,31,26,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1814; --fg:#ece7de; --muted:#9c948a; --line:#332f28;
    --rail:#44403a; --accent:#e58a4e; --accent-soft:#33241a; --link:#7fb0ff; --meal:#5bd4a0; --day:#ff8fb3; --alert:#ff6b6b; --priv:#b388ff;
    --dot-bg:#1a1814; --card:#232019;
    --shadow:0 1px 3px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:16px/1.6 -apple-system,"Noto Sans TC","Microsoft JhengHei",serif;
}
.wrap{max-width:640px; margin:0 auto; padding:26px 16px 64px}
h1{font-size:23px; margin:0 0 2px; letter-spacing:.02em}
.sub{color:var(--muted); font-size:14px; margin:0 0 14px}

/* ── 日期快速跳轉列（置頂） ── */
nav{
  position:sticky; top:0; z-index:10;
  background:var(--bg); border-bottom:1px solid var(--line);
  margin:0 -16px 24px; padding:8px 12px;
  overflow-x:auto; white-space:nowrap; -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav a{
  display:inline-block; font-size:14px; text-decoration:none; text-align:center;
  color:var(--muted); background:var(--card); border:1px solid var(--line);
  border-radius:12px; padding:4px 11px 5px; margin:0 3px;
  font-variant-numeric:tabular-nums; line-height:1.28;
}
nav a .dn{display:block; font-size:11px; letter-spacing:.4px; opacity:.8}
nav a.today{color:#fff; background:var(--accent); border-color:var(--accent); font-weight:700}

/* ── 時間軸 ── */
.tl{position:relative; padding-left:30px}
.tl::before{
  content:""; position:absolute; left:9px; top:6px; bottom:6px;
  width:2px; background:var(--rail); border-radius:2px;
}
.ev{position:relative; margin-bottom:24px; scroll-margin-top:58px}
.ev::before{
  content:""; position:absolute; left:-29px; top:5px;
  width:12px; height:12px; border-radius:50%;
  background:var(--dot-bg); border:3px solid var(--accent);
}
/* 每日標題：一天只顯示一次「第幾天・日期 週幾」 */
.day-head{
  position:relative; margin:30px 0 14px; scroll-margin-top:58px;
  font-size:36px; line-height:1.15; color:var(--day); font-weight:700;
  letter-spacing:.02em; font-variant-numeric:tabular-nums;
}
.day-head:first-child{margin-top:0}
.day-head .dow{color:var(--muted); font-weight:400; margin-left:10px; font-size:22px}
.day-head::before{
  content:""; position:absolute; left:-26px; top:18px;
  width:12px; height:12px; border-radius:3px; background:var(--day);
}
.when{font-size:18px; color:var(--accent); font-weight:700; letter-spacing:.05em; font-variant-numeric:tabular-nums}
.when .dow{color:var(--muted); font-weight:400; margin-left:5px}
.ev h2{font-size:16.5px; margin:1px 0 7px}
.ev h2.meal{color:var(--meal)}
.ev h2.alert{color:var(--alert)}
.when + .body{margin-top:6px}
.body + .body{margin-top:8px}
.body{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:10px 14px; box-shadow:var(--shadow); font-size:14.5px;
}
.body p{margin:5px 0}
.body .note{color:var(--muted); font-size:13px}
.chip{
  display:inline-block; font-size:12px; background:var(--accent-soft); color:var(--accent);
  border-radius:5px; padding:1px 8px; margin:2px 6px 2px 0; font-weight:600;
}
/* ── 擇一行程：膠囊標籤 + 對應內容 ── */
.opts{margin:2px 0 6px}
.opt-tab{
  display:inline-block; font-size:13px; font-family:inherit; cursor:pointer;
  color:var(--muted); background:var(--card); border:1px solid var(--line);
  border-radius:99px; padding:3px 14px; margin:2px 6px 2px 0;
}
.opt-tab.on{color:#fff; background:var(--accent); border-color:var(--accent); font-weight:700}

a{color:var(--link); text-decoration:none}
.map{font-size:13px; white-space:nowrap}

/* ── 資訊區塊與行前清單 ── */
section.block{margin-top:34px}
section.block h2{font-size:17px; border-bottom:2px solid var(--accent); display:inline-block; padding-bottom:2px; margin:0 0 12px}
details.block{margin:0 0 22px; scroll-margin-top:58px}
details.block summary{
  font-size:16px; font-weight:700; cursor:pointer; list-style-position:inside;
  padding:9px 14px; background:var(--card); border:1px solid var(--line);
  border-radius:10px; box-shadow:var(--shadow); user-select:none;
}
details.block[open] summary{border-radius:10px 10px 0 0}
details.block .info{border-top:0; border-radius:0 0 10px 10px; box-shadow:var(--shadow)}
.info{background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:4px 14px; font-size:14.5px}
.info p{margin:9px 0}
.info b{color:var(--accent)}
ul.check{list-style:none; margin:0; padding:0}
ul.check li.ck-group{
  margin:12px 0 2px; font-weight:700; font-size:13px; color:var(--accent);
  letter-spacing:.5px;
}
ul.check li.ck-group:first-child{margin-top:4px}
.ck-count{font-size:13px; font-weight:400; color:var(--muted)}
ul.check li{padding:2px 0}
ul.check label{display:flex; gap:9px; align-items:baseline; cursor:pointer}
ul.check input{accent-color:var(--accent); transform:translateY(2px)}
ul.check input:checked + span{color:var(--muted); text-decoration:line-through}
footer{margin-top:40px; text-align:center; color:var(--muted); font-size:12.5px}

/* ── 即時航班表格 ── */
.fl-table{width:100%; border-collapse:collapse; font-size:14px; margin-top:4px}
.fl-table td{padding:4px 0; border-bottom:1px dashed var(--line); vertical-align:top}
.fl-table tr:last-child td{border-bottom:none}
.fl-table td:first-child{color:var(--muted); width:7em; font-size:13px}
.fl-table td[data-f]{font-weight:600; font-variant-numeric:tabular-nums}
.fl-table td.fl-hot{color:var(--accent)}

/* ── 雪場直播影像（響應式 16:9） ── */
.live-cam{width:100%; aspect-ratio:16/9; border:0; border-radius:8px; margin-top:2px; background:#000}

/* ── JR 路線標記（路線代碼框 + 路線名色塊，顏色取自 JR 東日本路線色） ── */
.jr-code{
  display:inline-block; min-width:2em; text-align:center;
  font-size:12px; font-weight:700; line-height:1.5;
  color:var(--jr); background:#fff; border:2px solid var(--jr);
  border-radius:4px; padding:0 3px; margin-right:6px; vertical-align:2px;
}
.jr-line{
  display:inline-block; font-size:14px; font-weight:700; line-height:1.6;
  color:#fff; background:var(--jr); border-radius:4px; padding:0 9px;
  margin-right:6px; vertical-align:1px;
}
/* 東京地鐵：圓形路線代碼（與 JR 的方形外框區分） */
.mt-code{
  display:inline-block; width:23px; height:23px; line-height:19px; text-align:center;
  font-size:12px; font-weight:700; color:var(--jr); background:#fff;
  border:2px solid var(--jr); border-radius:50%; margin-right:6px; vertical-align:2px;
}
.jr-line.yu{color:#2b2b2b}   /* 有樂町線底色偏亮，文字改深色才讀得清楚 */
.yu{--jr:#c1a470}   /* 有樂町線 */
.gi{--jr:#f39700}   /* 銀座線 */
.ma{--jr:#f62e36}   /* 丸之內線 */
.jy{--jr:#9acd32}
.jk{--jr:#00b2e5}
.ja{--jr:#00b48d}   /* 埼京線 */
.js{--jr:#e21f26}   /* 湘南新宿線 */
.sa{--jr:#d45f81}   /* 都電荒川線（東京櫻花路面電車） */
.mt-code.sa{font-size:10.5px; letter-spacing:-.5px}   /* 兩個字母的圓標字要小一點 */
/* 路線列：屬於節點內容，但不放進卡片外框 */
.jr-row{margin:8px 0 0; font-size:14.5px}
/* 提醒事項（例如要先訂票） */
.remind{color:var(--alert); font-weight:700}

/* ── 一鍵複製 ── */
.copy-btn{
  display:inline-block; margin-left:6px; padding:2px 8px;
  font-size:12.5px; font-family:inherit; line-height:1.6;
  color:var(--link); background:transparent;
  border:1px solid var(--line); border-radius:6px; cursor:pointer;
}
.copy-btn:active{opacity:.6}
.copy-btn.done{color:var(--meal); border-color:var(--meal)}

/* ── 時刻表圖片 ── */
.sched-img{width:100%; border-radius:8px; border:1px solid var(--line); margin-top:4px}

/* ── 已過去的行程灰階顯示 ── */
.ev.past > *{opacity:.4; filter:grayscale(1)}
.ev.past::before{border-color:var(--rail)}
/* 雪場資訊不是時間事件，不顯示軸點 */
#ski-info::before{display:none}
/* 私人行程節點：軸點換色並在時刻後加鎖頭，一眼分得出朋友看不到的部分 */
.ev.private::before{border-color:var(--priv)}
/* 過去的私人節點同樣要灰：權重需高於 .ev.private::before，否則紫色會蓋掉灰色 */
.ev.private.past::before{border-color:var(--rail)}
.ev.private .when::after{content:" 🔒"; font-size:12px; opacity:.6}
.day-head.past, .day-head.past .dow{color:var(--rail)}
.day-head.past::before{background:var(--rail)}
.fl-updated.err{color:#c0392b}
/* ── 編輯介面（解鎖後才出現） ── */
.ed-fab{
  position:fixed; right:16px; bottom:16px; z-index:50;
  width:52px; height:52px; border-radius:50%; border:0; cursor:pointer;
  font-size:22px; color:#fff; background:var(--priv);
  box-shadow:0 3px 12px rgba(0,0,0,.35);
}
.ed-fab.on{background:var(--meal)}
.ed-bar{
  position:fixed; left:0; right:0; bottom:0; z-index:49;
  padding:10px 76px 10px 16px; font-size:12.5px; line-height:1.5;
  color:#fff; background:rgba(20,20,20,.94);
}
.ed-tools{margin-top:6px; display:flex; gap:8px}
.ed-tools button, .ed-add button{
  font-size:13px; padding:4px 10px; cursor:pointer;
  color:var(--fg); background:var(--card);
  border:1px solid var(--line); border-radius:8px;
}
.ed-add{display:flex; gap:8px; margin:4px 0 12px}
body.editing .ev{outline:1px dashed var(--line); outline-offset:6px}
.ed-mask{
  position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
  padding:16px; background:rgba(0,0,0,.6);
}
.ed-box{
  width:100%; max-width:520px; max-height:88vh; overflow:auto;
  padding:16px; border-radius:14px; background:var(--card); border:1px solid var(--line);
}
.ed-box h3{margin:0 0 12px; font-size:16px}
.ed-box label{display:block; margin-bottom:10px; font-size:13px; color:var(--muted)}
.ed-box input, .ed-box textarea, .ed-box select{
  width:100%; margin-top:4px; padding:8px; font:inherit; font-size:14px;
  color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:8px;
}
.ed-box textarea{resize:vertical}
.ed-note{margin:0 0 10px; font-size:12.5px; color:var(--priv)}
.ed-btns{display:flex; gap:10px; justify-content:flex-end}
.ed-btns button{
  padding:9px 18px; font-size:14px; cursor:pointer; border-radius:8px;
  color:var(--fg); background:var(--bg); border:1px solid var(--line);
}
.ed-btns button.pri{color:#fff; background:var(--link); border-color:var(--link)}
.ed-toast{
  position:fixed; left:50%; bottom:86px; transform:translateX(-50%); z-index:70;
  padding:9px 18px; font-size:14px; color:#fff; background:rgba(20,20,20,.95);
  border-radius:20px; box-shadow:0 2px 10px rgba(0,0,0,.4);
}
.nrt-head{margin:12px 0 2px; font-size:13.5px; border-top:1px solid var(--line); padding-top:10px}
</style>
</head>

<script>
// 時間軸由上方 trip-data 的 JSON 產生；之後若有雲端修改會再套用上去
(function(){
  var data=JSON.parse(document.getElementById('trip-data').textContent);
  window.__tripData=data;

  function fill(ev, it){
    var h='';
    if(it.time)  h+='<div class="when">'+it.time+'</div>';
    if(it.title) h+='<h2'+(it.cls?' class="'+it.cls+'"':'')+'>'+it.title+'</h2>';
    if(it.body){                       // 可以是一張卡片或多張
      (Array.isArray(it.body)?it.body:[it.body]).forEach(function(b){
        h+='<div class="body">'+b+'</div>';
      });
    }
    if(it.below){                      // 可以是字串或多行陣列
      (Array.isArray(it.below)?it.below:[it.below]).forEach(function(b){
        h+='<p class="jr-row">'+b+'</p>';
      });
    }
    ev.innerHTML=h;
    ev.dataset.id=it.id;
    if(it.nodeId) ev.id=it.nodeId;
  }
  window.__tripFill=fill;

  function render(){
    var tl=document.querySelector('.tl');
    tl.textContent='';
    data.days.forEach(function(d){
      var head=document.createElement('div');
      head.className='day-head';
      head.id=d.id;
      head.innerHTML=d.label+'<span class="dow">'+d.dow+'</span>';
      tl.appendChild(head);
      data.items.forEach(function(it){
        if(it.day!==d.id) return;
        var ev=document.createElement('div');
        ev.className='ev';
        fill(ev, it);
        tl.appendChild(ev);
      });
    });
  }
  window.__tripRender=render;
  render();
})();

// 行前清單勾選狀態存在瀏覽器本機（換裝置不會同步）
(function(){
  var KEY='japan2027-checklist-v2';      // v1 用索引存，清單改版後會錯位，故換鍵
  var boxes=document.querySelectorAll('#cklist input');
  var out=document.getElementById('ck-count');
  function store(){
    try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ return {}; }
  }
  function count(){
    var n=0;
    boxes.forEach(function(b){ if(b.checked) n++; });
    if(out) out.textContent='（'+n+' / '+boxes.length+'）';
  }
  var s=store();
  boxes.forEach(function(b){ b.checked=!!s[b.getAttribute('data-ck')]; });
  count();
  boxes.forEach(function(b){
    b.addEventListener('change', function(){
      var s=store();
      s[b.getAttribute('data-ck')]=b.checked;
      try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){}
      count();
    });
  });
  // 清單項目裡的連結要能正常點開，不要順便勾到 checkbox
  document.querySelectorAll('#cklist a').forEach(function(a){
    a.addEventListener('click', function(e){ e.stopPropagation(); });
  });
})();

(function(){
  var API='https://www.taoyuan-airport.com/api/api/flight/a_flight/airlines';
  var SEC='https://pfms.taoyuan-airport.com/es/crowdedness/T1/last';
  // 航班查詢 id：日期_出發(D)/抵達(A)_航班號
  // 航班查詢一律使用「當天日期」（yyyyMMdd）
  function ymd(){
    var d=new Date();
    return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  }
  // 成田代理（Cloudflare Worker）網址，部署後填入；留空則成田區塊顯示「未設定」
  var NARITA_PROXY='https://narita-proxy.4511760.workers.dev/';

  function setCell(tbl, key, val, hot){
    var td=document.querySelector('#'+tbl+' td[data-f="'+key+'"]');
    if(!td) return;
    td.textContent=(val && String(val).trim() && val!=='-') ? val : '—';
    td.classList.toggle('fl-hot', !!hot && !!val && String(val).trim()!=='' && val!=='-');
  }

  // 多行顯示（每個查驗處/安檢站一行），用 DOM 組避免字串injection
  function setCellLines(tbl, key, lines, hot){
    var td=document.querySelector('#'+tbl+' td[data-f="'+key+'"]');
    if(!td) return;
    lines=(lines||[]).filter(Boolean);
    td.textContent='';
    if(!lines.length){ td.textContent='—'; td.classList.remove('fl-hot'); return; }
    lines.forEach(function(line,i){
      if(i) td.appendChild(document.createElement('br'));
      td.appendChild(document.createTextNode(line));
    });
    td.classList.toggle('fl-hot', !!hot);
  }

  function fetchFlight(id, tbl, isDep){
    return fetch(API,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:id, language:'ch'})
    }).then(function(r){return r.json();}).then(function(j){
      var f=j.a_flight||{};
      // 機場 API 僅提供近日航班，太早查會回「查無此航班」
      if(!j.a_flight && j.statusCode){ setCell(tbl,'st','尚無資料（接近當天才會公布）'); return; }
      // 狀態可能在 CurrentStatus 或 Memo（例如「取消」在 Memo），兩者都有就合併顯示
      var st=[(f.CurrentStatus||'').trim(), (f.Memo||'').trim()].filter(Boolean).join('・');
      setCell(tbl,'st', st, true);
      setCell(tbl,'gate', f.Gate, true);
      setCell(tbl,'otime', f.OTime ? f.OTime.slice(0,5) : '');
      setCell(tbl,'rtime', f.RTime ? f.RTime.slice(0,5) : '', true);
      if(isDep){
        setCell(tbl,'checkin', f.CheckIn ? f.CheckIn+' 號櫃台' : '', true);
        setCell(tbl,'plane', f.PlaneNo);
      }else{
        // 抵達航班的行李轉盤，桃園 API 放在 StopCode 欄位
        setCell(tbl,'belt', f.StopCode, true);
      }
    });
  }

  // 成田的門／櫃台欄位：取出名稱與 POI，有 POI 就做成官網地圖連結
  function setCellPoi(tbl, key, arr, hot){
    var td=document.querySelector('#'+tbl+' td[data-f="'+key+'"]');
    if(!td) return;
    var items=(arr||[]).map(function(x){
      if(typeof x==='string') return {text:x, poi:''};
      return {
        text: x.gateNo || x.gate || x.gateName || x.name || x.counter || x.counterNo || '',
        poi: x.gatePOI || x.poi || x.POI || ''
      };
    }).filter(function(x){ return x.text; });
    td.textContent='';
    if(!items.length){ td.textContent='—'; td.classList.remove('fl-hot'); return; }
    items.forEach(function(it,i){
      if(i) td.appendChild(document.createTextNode('、'));
      if(it.poi){
        var a=document.createElement('a');
        a.href='https://www.narita-airport.jp/zh-tc/map/?poi='+encodeURIComponent(it.poi);
        a.target='_blank'; a.rel='noopener';
        a.textContent=it.text;
        td.appendChild(a);
      }else{
        td.appendChild(document.createTextNode(it.text));
      }
    });
    td.classList.toggle('fl-hot', !!hot);
  }

  function fetchNarita(type, id, tbl, isArr){
    if(!NARITA_PROXY){ setCell(tbl,'st','（成田代理未設定）'); return Promise.resolve(); }
    return fetch(NARITA_PROXY+'?type='+type+'&id='+id)
      .then(function(r){return r.json();}).then(function(j){
        var f=j.flight;
        if(!f){ setCell(tbl,'st','尚無資料（接近當天才會公布）'); return; }
        setCell(tbl,'st', f.status && f.status.status, true);
        setCell(tbl,'otime', f.scheduledTime, false);
        setCellPoi(tbl,'gate', f.gates, true);
        if(!isArr){
          var ci=f.checkInCounterOrArrivalLobby||{};
          var cnt=(ci.changeNameOfCheckInOrArrival && ci.changeNameOfCheckInOrArrival.length) ? ci.changeNameOfCheckInOrArrival : ci.nameOfCheckInOrArrival;
          setCellPoi(tbl,'checkin', cnt, true);
        }
        // 出發安檢擁擠度（入境審查改用專頁 API，見 fetchImm）：每個安檢站一行，關閉中也照實顯示
        if(!isArr){
          var secLines=(j.flightSecurity||[]).map(function(s){
            var c=s.congestion && s.congestion.text;
            // 安檢站名稱去掉「國際航班」，只留航廈與位置
            var nm=(s.locationName||'').replace('國際航班','').replace(/\s+/g,' ').trim();
            return c ? nm+'：'+c : null;
          });
          setCellLines(tbl,'sec', secLines, /40|60/.test(secLines.join('')));
        }
      });
  }

  // 成田入境審查等待時間（外國旅客通道），只顯示抵達航廈 T2 的查驗處
  function fetchImm(){
    if(!NARITA_PROXY) return Promise.resolve();
    return fetch(NARITA_PROXY+'?type=imm')
      .then(function(r){return r.json();}).then(function(j){
        var rows=(j.immigration||[]).filter(function(s){return s.terminal==='T2';});
        var lines=rows.map(function(s){
          var name=(s.name||'').replace(' 入境審查處','');
          return name+'：'+(s.abroad||'—');
        });
        setCellLines('fl-dep-nrt','imm', lines, /40|60/.test(lines.join('')));
      });
  }

  function fetchSecurity(){
    return fetch(SEC).then(function(r){return r.json();}).then(function(j){
      var s=j.hits.hits[0]._source;
      setCell('fl-dep','security', '約 '+s.averageSecurityWaitTime+' 分鐘', s.averageSecurityWaitTime>=15);
    });
  }

  function setUpdated(text, isErr){
    // 每次重查，節點被改寫後仍能正確更新
    document.querySelectorAll('.fl-updated').forEach(function(el){
      el.textContent=text; el.classList.toggle('err', !!isErr);
    });
  }
  function refresh(){
    var t=ymd();
    // 成田與桃園官網連結同步換成當天日期
    var la=document.getElementById('nrt-arr-link'); if(la) la.href='https://www.narita-airport.jp/zh-tc/flight/arr-search/'+t+'-JX0802/';
    var ld=document.getElementById('nrt-dep-link'); if(ld) ld.href='https://www.narita-airport.jp/zh-tc/flight/dep-search/'+t+'-JX0803/';
    var ta=document.getElementById('tpe-dep-link'); if(ta) ta.href='https://www.taoyuan-airport.com/flight_depart/'+t+'_D_JX802?lang=ch';
    var tb=document.getElementById('tpe-arr-link'); if(tb) tb.href='https://www.taoyuan-airport.com/flight_arrival/'+t+'_A_JX803?lang=ch';
    // 利木津巴士時刻表帶當天日期（yyyy-mm-dd）
    var td=t.slice(0,4)+'-'+t.slice(4,6)+'-'+t.slice(6,8);
    var lm=document.getElementById('limousine-link'); if(lm) lm.href='https://www.limousinebus.co.jp/zh-tw/timetable/detail/Narita-Ikebukuro/?dir=2&d='+td;
    var jobs=[fetchFlight(t+'_D_JX802','fl-dep',true), fetchFlight(t+'_A_JX803','fl-ret',false), fetchSecurity(),
              fetchNarita('arr',t+'-JX0802','fl-dep-nrt',true), fetchNarita('dep',t+'-JX0803','fl-ret-nrt',false), fetchImm()];
    Promise.allSettled ? Promise.allSettled(jobs).then(done) : Promise.all(jobs).then(done, fail);
    function done(rs){
      var fails = rs && rs.filter ? rs.filter(function(x){return x.status==='rejected';}).length : 0;
      // 有來源失敗時 5 秒後補抓一次，避免剛開頁遇到暫時性失敗就空等 30 秒
      if(fails && !refresh.retrying){
        refresh.retrying=true;
        setTimeout(function(){ refresh.retrying=false; refresh(); }, 5000);
      }
      if(fails===rs.length){ fail(); return; }
      var t=new Date();
      setUpdated('最後更新 '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+':'+String(t.getSeconds()).padStart(2,'0')+(fails?'（部分來源失敗）':''), false);
    }
    function fail(){ setUpdated('更新失敗（網路或 API 無回應），30 秒後重試', true); }
  }

  refresh();
  setInterval(function(){ if(!document.hidden) refresh(); }, 30000);
  // 手機切回頁面時立即更新一次
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) refresh(); });
  // 事件委派：節點被改寫後「立即更新」仍可用
  document.addEventListener('click', function(e){
    var t=e.target.closest && e.target.closest('.fl-refresh');
    if(t){ e.preventDefault(); refresh(); }
  });
})();

// 擇一行程：點膠囊標籤切換內容，選擇記在 localStorage
(function(){
  var KEY='japan2027-opts';
  function store(){
    try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ return {}; }
  }
  function pick(group, i){
    var id=group.getAttribute('data-opt'), v=String(i);
    group.querySelectorAll('.opt-tab').forEach(function(t){
      t.classList.toggle('on', t.getAttribute('data-opt-i')===v);
    });
    var host=group.parentNode;
    host.querySelectorAll('.opt-pane[data-opt="'+id+'"]').forEach(function(p){
      p.hidden = p.getAttribute('data-opt-i')!==v;
    });
  }
  function apply(){
    var s=store();
    document.querySelectorAll('.opts').forEach(function(g){
      pick(g, s[g.getAttribute('data-opt')] || '0');
    });
  }
  document.addEventListener('click', function(e){
    var t=e.target.closest && e.target.closest('.opt-tab');
    if(!t) return;
    e.preventDefault();
    var g=t.closest('.opts'), i=t.getAttribute('data-opt-i');
    pick(g, i);
    var s=store(); s[g.getAttribute('data-opt')]=i;
    try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(err){}
  });
  apply();
  // 解鎖私人行程或套用雲端修改會重畫節點，重畫後要重新套用選擇
  var tl=document.querySelector('.tl');
  if(tl && window.MutationObserver) new MutationObserver(apply).observe(tl, {childList:true});
})();

// 一鍵複製：任何帶 data-copy 的元素被點擊就複製其內容
(function(){
  function fallback(text){            // 非 https 或舊瀏覽器用的退路
    var ta=document.createElement('textarea');
    ta.value=text; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(err){}
    document.body.removeChild(ta);
  }
  document.addEventListener('click', function(e){
    var b=e.target.closest && e.target.closest('[data-copy]');
    if(!b) return;
    e.preventDefault();
    var text=b.getAttribute('data-copy'), label=b.textContent;
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text)['catch'](function(){ fallback(text); });
    } else { fallback(text); }
    b.classList.add('done'); b.textContent='✓ 已複製';   // ✓ 已複製
    setTimeout(function(){ b.classList.remove('done'); b.textContent=label; }, 1500);
  });
})();

// 體驗優化：過去的行程灰階顯示、雪場資訊卡依日期移動
(function(){
  // 各日期標題對應的日期
  // 【測試模式】正式值：2027-01-16 ～ 2027-01-23
  var DAY_DATES={d0116:'2026-10-24',d0117:'2026-10-25',d0118:'2026-10-26',d0119:'2026-10-27',
                 d0120:'2026-10-28',d0121:'2026-10-29',d0122:'2026-10-30',d0123:'2026-10-31'};

  function dateStr(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  // 雪場資訊卡：今天 <=1/17 放第2天、=1/18 放第3天、>=1/19 放第4天
  function moveSkiInfo(now){
    var today=dateStr(now);
    // 【測試模式】正式值：2027-01-17 / 2027-01-18
    var target = today<=DAY_DATES.d0117 ? 'd0117' : (today===DAY_DATES.d0118 ? 'd0118' : 'd0119');
    var head=document.getElementById(target), card=document.getElementById('ski-info');
    if(head && card && head.nextElementSibling!==card) head.insertAdjacentElement('afterend', card);
  }

  // 找出目前進行中的節點（最後一個「開始時間 <= 現在」的有時刻節點）
  function currentNode(now){
    var curDate=null, cur=null;
    document.querySelectorAll('.tl > *').forEach(function(el){
      if(el.classList.contains('day-head')){ curDate=DAY_DATES[el.id]||curDate; }
      else if(el.classList.contains('ev')){
        var w=el.querySelector('.when');
        var t=w && /^\d{2}:\d{2}$/.test(w.textContent.trim()) ? w.textContent.trim() : null;
        if(curDate && t){ var dt=new Date(curDate+'T'+t+':00'); if(dt<=now) cur={el:el, date:curDate}; }
      }
    });
    return cur;
  }

  // 每小時把目前行程捲到畫面中間
  function centerCurrent(now){
    var today=dateStr(now), cur=currentNode(now), target=null;
    if(cur && cur.date===today){
      target=cur.el;
    }else{
      // 今天還沒有行程開始（例如剛過午夜）：對齊今天的日期標題
      Object.keys(DAY_DATES).forEach(function(id){
        if(DAY_DATES[id]===today){ var h=document.getElementById(id); if(h) target=h; }
      });
    }
    if(target) target.scrollIntoView({behavior:'smooth', block:'center'});
  }

  // 已開始節點之前（不含）的行程灰階；過去的日期標題與無時刻節點也灰階
  function grayPast(now){
    var today=dateStr(now);
    var curDate=null, items=[];
    document.querySelectorAll('.tl > *').forEach(function(el){
      if(el.classList.contains('day-head')){
        curDate=DAY_DATES[el.id]||curDate;
        items.push({el:el, date:curDate, dt:null, isHead:true});
      }else if(el.classList.contains('ev')){
        var w=el.querySelector('.when');
        var t=w && /^\d{2}:\d{2}$/.test(w.textContent.trim()) ? w.textContent.trim() : null;
        items.push({el:el, date:curDate, dt:(curDate&&t)?new Date(curDate+'T'+t+':00'):null, isHead:false});
      }
    });
    // 目前進行中的節點＝最後一個「開始時間 <= 現在」的有時刻節點
    var started=items.filter(function(x){return x.dt && x.dt<=now;});
    var cur=started.length?started[started.length-1]:null;
    items.forEach(function(x){
      var past;
      // 前幾天的行程一律算過去（跨過午夜就整天灰掉），當天則以進行中的節點為界
      if(x.dt) past = (x.date < today) || (!!cur && x.dt < cur.dt);
      else past = !!x.date && x.date < today;
      x.el.classList.toggle('past', !!past);
    });
  }

  function tick(now){ moveSkiInfo(now); grayPast(now); }
  window.__tripTick=tick; // 供測試模擬時間用
  window.__tripCenter=centerCurrent;
  tick(new Date());
  setInterval(function(){ tick(new Date()); }, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick(new Date()); });
  // 開頁（稍等自動捲動完成後）與之後每小時，把目前行程置中
  setTimeout(function(){ centerCurrent(new Date()); }, 800);
  setInterval(function(){ if(!document.hidden) centerCurrent(new Date()); }, 3600000);
})();

// 私人行程 + 雲端修改
// · 私人行程以 AES-GCM 加密存在 private.enc，輸入密碼才解得開
// · 解鎖後才會拿到寫入權杖（權杖就鎖在加密檔裡），因此只有解鎖的裝置能改行程
// · 解鎖：網址加 #k=你的密碼（解開後存在這台裝置，並把密碼從網址移除）；鎖回：網址加 #lock
(function(){
  var PW_KEY='japan2027-pw';
  var PENDING='japan2027-pending';          // 離線時暫存待上傳的修改
  var API='https://narita-proxy.4511760.workers.dev/data';
  var S={pw:null, token:null, priv:[], pub:{edits:{},added:[],removed:[]}, unlocked:false};
  window.__trip=S;

  function b2u(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
  function u2b(buf){
    var a=new Uint8Array(buf), s='';
    for(var i=0;i<a.length;i++) s+=String.fromCharCode(a[i]);
    return btoa(s);
  }
  async function keyFrom(pw, salt, it, use){
    var km=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:salt, iterations:it, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, [use]);
  }
  async function decryptBlob(b, pw){
    var key=await keyFrom(pw, b2u(b.salt), b.it, 'decrypt');
    var pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:b2u(b.iv)}, key, b2u(b.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function encryptBlob(obj, pw){
    var salt=crypto.getRandomValues(new Uint8Array(16));
    var iv=crypto.getRandomValues(new Uint8Array(12));
    var it=200000;
    var key=await keyFrom(pw, salt, it, 'encrypt');
    var ct=await crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, key,
      new TextEncoder().encode(JSON.stringify(obj)));
    return {v:1, it:it, salt:u2b(salt), iv:u2b(iv), ct:u2b(ct)};
  }

  // 依時間把節點插進當天正確位置
  function insertItem(it, isPrivate){
    var head=document.getElementById(it.day);
    if(!head) return null;
    var ev=document.createElement('div');
    ev.className='ev'+(isPrivate?' private':'');
    window.__tripFill(ev, it);
    var node=head.nextElementSibling, before=null;
    while(node && !node.classList.contains('day-head')){
      var w=node.querySelector && node.querySelector('.when');
      var t=w && /^\d{2}:\d{2}$/.test(w.textContent.trim()) ? w.textContent.trim() : null;
      if(it.time && t && t>it.time){ before=node; break; }
      node=node.nextElementSibling;
    }
    head.parentNode.insertBefore(ev, before || node);
    return ev;
  }
  window.__tripInject=function(items){ (items||[]).forEach(function(it){ insertItem(it, true); }); };

  // 重畫：基礎資料 → 套用雲端修改 → 補上私人行程
  function repaint(){
    window.__tripRender();
    var pub=S.pub||{};
    (pub.removed||[]).forEach(function(id){
      var el=document.querySelector('.ev[data-id="'+id+'"]');
      if(el) el.remove();
    });
    Object.keys(pub.edits||{}).forEach(function(id){
      var el=document.querySelector('.ev[data-id="'+id+'"]');
      if(!el) return;
      var base=null;
      (window.__tripData.items||[]).forEach(function(i){ if(i.id===id) base=i; });
      var merged={}, src=Object.assign({}, base||{}, pub.edits[id]);
      Object.keys(src).forEach(function(k){ if(src[k]!=null && src[k]!=='') merged[k]=src[k]; });
      merged.id=id;
      window.__tripFill(el, merged);
    });
    (pub.added||[]).forEach(function(it){ insertItem(it, false); });
    S.priv.forEach(function(it){ insertItem(it, true); });
    if(window.__tripTick) window.__tripTick(new Date());
  }
  window.__tripRepaint=repaint;

  // 讀取雲端上的修改（任何人都讀得到；私人部分仍是密文）
  async function loadCloud(){
    var r=await fetch(API, {cache:'no-store'});
    if(!r.ok) throw new Error('data '+r.status);
    return r.json();
  }

  async function unlock(pw){
    var r=await fetch('private.enc', {cache:'no-store'});
    if(!r.ok) throw new Error('no blob');
    var doc=await decryptBlob(await r.json(), pw);
    return Array.isArray(doc) ? {items:doc, editToken:null} : doc;
  }

  var booted=false;
  async function boot(){
    if(location.hash==='#lock'){
      try{ localStorage.removeItem(PW_KEY); }catch(e){}
      history.replaceState(null,'',location.pathname+location.search);
      if(booted) location.reload();
      return;
    }
    // 先套用雲端上的公開修改（朋友也看得到）
    var cloud=null;
    try{ cloud=await loadCloud(); }catch(e){}
    if(cloud && cloud.pub) S.pub=cloud.pub;

    if(booted){ repaint(); return; }

    var m=location.hash.match(/^#k=(.+)$/), pw=null;
    if(m){
      pw=decodeURIComponent(m[1]);
      history.replaceState(null,'',location.pathname+location.search);
    }else{
      try{ pw=localStorage.getItem(PW_KEY); }catch(e){}
    }

    if(pw){
      try{
        var doc=await unlock(pw);
        S.pw=pw; S.token=doc.editToken||null; S.priv=doc.items||[]; S.unlocked=true;
        try{ localStorage.setItem(PW_KEY, pw); }catch(e){}
        // 雲端若有更新過的私人行程，以雲端為準
        if(cloud && cloud.priv){
          try{ var pd=await decryptBlob(cloud.priv, pw); if(Array.isArray(pd)) S.priv=pd; }catch(e){}
        }
      }catch(e){ /* 密碼錯或檔案不存在：安靜略過，不留痕跡 */ }
    }

    booted=true;
    repaint();
    if(window.__tripCenter) setTimeout(function(){ window.__tripCenter(new Date()); }, 300);
    if(S.unlocked && window.__tripEditUI) window.__tripEditUI();
    // 補送離線期間存下的修改
    if(S.unlocked && S.token) flushPending();
  }

  // 儲存：先更新畫面與本機，再送雲端；沒網路就留著下次補送
  async function save(){
    repaint();
    var payload={pub:S.pub, priv:null};
    if(S.pw) payload.priv=await encryptBlob(S.priv, S.pw);
    try{ localStorage.setItem(PENDING, JSON.stringify(payload)); }catch(e){}
    if(!S.token) return {ok:false, reason:'未解鎖'};
    try{
      var r=await fetch(API, {method:'POST',
        headers:{'Content-Type':'application/json','X-Edit-Token':S.token},
        body:JSON.stringify(payload)});
      if(!r.ok) throw new Error('HTTP '+r.status);
      try{ localStorage.removeItem(PENDING); }catch(e){}
      return {ok:true};
    }catch(e){
      return {ok:false, reason:'沒網路，已存在手機，連線後會自動上傳'};
    }
  }
  window.__tripSave=save;

  async function flushPending(){
    var raw=null;
    try{ raw=localStorage.getItem(PENDING); }catch(e){}
    if(!raw) return;
    try{
      var r=await fetch(API, {method:'POST',
        headers:{'Content-Type':'application/json','X-Edit-Token':S.token}, body:raw});
      if(r.ok) localStorage.removeItem(PENDING);
    }catch(e){}
  }
  window.addEventListener('online', function(){ if(S.token) flushPending(); });

  boot();
  window.addEventListener('hashchange', boot);
})();

// 編輯介面：只有解鎖後才會出現（由上面的 __tripEditUI 觸發）
(function(){
  var S=window.__trip, editing=false, fab=null, bar=null;
  var BLANK=String.fromCharCode(10,10);          // 多段內容的分隔（空白行）
  var SPLIT=new RegExp(String.fromCharCode(10)+String.fromCharCode(92)+'s*'+String.fromCharCode(10));

  function el(tag, cls, html){
    var e=document.createElement(tag);
    if(cls) e.className=cls;
    if(html!=null) e.innerHTML=html;
    return e;
  }
  // 找出某個節點目前的資料（基礎資料 + 雲端修改 / 新增 / 私人）
  function dataOf(id){
    var found=null;
    (S.pub.added||[]).forEach(function(i){ if(i.id===id) found=i; });
    if(found) return {it:found, where:'added'};
    S.priv.forEach(function(i){ if(i.id===id) found=i; });
    if(found) return {it:found, where:'priv'};
    (window.__tripData.items||[]).forEach(function(i){ if(i.id===id) found=i; });
    if(found) return {it:Object.assign({}, found, (S.pub.edits||{})[id]||{}), where:'base'};
    return null;
  }

  // ── 編輯表單 ──
  function openForm(id, dayId, isPrivate){
    var d=id?dataOf(id):null;
    var it=d?d.it:{id:'x'+Date.now().toString(36), day:dayId, time:'', title:'', body:'', below:''};
    var isNew=!id;
    var priv=isPrivate!=null?isPrivate:(d&&d.where==='priv');

    var box=el('div','ed-mask');
    box.innerHTML=
      '<div class="ed-box">'+
      '<h3>'+(isNew?(priv?'新增私人節點':'新增節點'):'編輯節點')+'</h3>'+
      '<label>時間 <input id="ed-time" placeholder="HH:MM" value="'+(it.time||'')+'"></label>'+
      '<label>標題 <input id="ed-title" value="'+(it.title||'').replace(/"/g,'&quot;')+'"></label>'+
      '<label>樣式 <select id="ed-cls">'+
        ['','meal','alert'].map(function(v){
          var n={'':'一般','meal':'用餐（綠）','alert':'重要（紅）'}[v];
          return '<option value="'+v+'"'+((it.cls||'')===v?' selected':'')+'>'+n+'</option>';
        }).join('')+'</select></label>'+
      '<label>卡片內容（可用 HTML，多張卡片以空白行分隔）<textarea id="ed-body" rows="4">'+
        (Array.isArray(it.body)?it.body.join(BLANK):(it.body||''))+'</textarea></label>'+
      '<label>框外補充行（多行請以空白行分隔）<textarea id="ed-below" rows="3">'+
        (Array.isArray(it.below)?it.below.join('\n\n'):(it.below||''))+'</textarea></label>'+
      (priv?'<p class="ed-note">🔒 這是私人節點，只有解鎖的裝置看得到</p>':'')+
      '<div class="ed-btns">'+
        '<button id="ed-cancel">取消</button>'+
        '<button id="ed-ok" class="pri">儲存</button>'+
      '</div></div>';
    document.body.appendChild(box);

    box.querySelector('#ed-cancel').onclick=function(){ box.remove(); };
    box.querySelector('#ed-ok').onclick=async function(){
      var v=function(s){ return box.querySelector(s).value.trim(); };
      var next={id:it.id, day:it.day, time:v('#ed-time'), title:v('#ed-title'),
                };
      var bd=v('#ed-body').split(SPLIT).map(function(x){return x.trim();}).filter(Boolean);
      if(bd.length) next.body = bd.length===1 ? bd[0] : bd;
      var bl=v('#ed-below').split(/\n\s*\n/).map(function(x){return x.trim();}).filter(Boolean);
      if(bl.length) next.below = bl.length===1 ? bl[0] : bl;
      var cls=v('#ed-cls'); if(cls) next.cls=cls;
      if(it.nodeId) next.nodeId=it.nodeId;
      if(next.time && !/^\d{2}:\d{2}$/.test(next.time)){ alert('時間請填 HH:MM，例如 09:30'); return; }

      if(priv){
        var i=-1;
        S.priv.forEach(function(x,k){ if(x.id===next.id) i=k; });
        if(i>=0) S.priv[i]=next; else S.priv.push(next);
      }else if(d && d.where==='added'){
        S.pub.added=(S.pub.added||[]).map(function(x){ return x.id===next.id?next:x; });
      }else if(isNew){
        S.pub.added=(S.pub.added||[]).concat([next]);
      }else{
        S.pub.edits=S.pub.edits||{};
        S.pub.edits[next.id]=next;
      }
      box.remove();
      await flush();
    };
  }

  async function flush(){
    var r=await window.__tripSave();
    decorate();
    toast(r.ok?'已儲存':(r.reason||'儲存失敗'));
  }

  function toast(msg){
    var t=el('div','ed-toast',msg);
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2600);
  }

  async function removeNode(id){
    if(!confirm('確定刪除這個節點？')) return;
    var d=dataOf(id);
    if(d && d.where==='priv'){
      S.priv=S.priv.filter(function(x){ return x.id!==id; });
    }else if(d && d.where==='added'){
      S.pub.added=(S.pub.added||[]).filter(function(x){ return x.id!==id; });
    }else{
      S.pub.removed=(S.pub.removed||[]).concat([id]);
      if(S.pub.edits) delete S.pub.edits[id];
    }
    await flush();
  }

  // 編輯模式下，在每個節點與每天標題補上操作按鈕
  function decorate(){
    document.querySelectorAll('.ed-tools, .ed-add').forEach(function(e){ e.remove(); });
    document.body.classList.toggle('editing', editing);
    if(!editing) return;
    document.querySelectorAll('.tl > .ev').forEach(function(ev){
      var id=ev.dataset.id;
      if(!id) return;
      var tools=el('div','ed-tools',
        '<button data-act="edit" title="編輯">✏️</button><button data-act="del" title="刪除">🗑</button>');
      tools.onclick=function(e){
        var b=e.target.closest('button'); if(!b) return;
        if(b.dataset.act==='edit') openForm(id);
        else removeNode(id);
      };
      ev.appendChild(tools);
    });
    document.querySelectorAll('.tl > .day-head').forEach(function(h){
      var add=el('div','ed-add',
        '<button data-p="0">＋ 新增節點</button><button data-p="1">＋ 新增私人節點</button>');
      add.onclick=function(e){
        var b=e.target.closest('button'); if(!b) return;
        openForm(null, h.id, b.dataset.p==='1');
      };
      h.insertAdjacentElement('afterend', add);
    });
  }

  function toggle(){
    editing=!editing;
    fab.textContent=editing?'✓':'✏️';
    fab.classList.toggle('on', editing);
    bar.style.display=editing?'block':'none';
    decorate();
  }

  window.__tripEditUI=function(){
    if(fab) return;
    fab=el('button','ed-fab','✏️');
    fab.title='編輯行程';
    fab.onclick=toggle;
    document.body.appendChild(fab);
    bar=el('div','ed-bar','編輯模式：可改時間與文字、新增或刪除節點。修改會同步到雲端，朋友也看得到（🔒 私人節點除外）。');
    bar.style.display='none';
    document.body.appendChild(bar);
  };
})();

// 旅途當天自動標示今天的日期，並捲動到當日行程
(function(){
  var now=new Date();
  var today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  var link=document.querySelector('nav a[data-d="'+today+'"]');
  if(link){
    link.classList.add('today');
    var target=document.querySelector(link.getAttribute('href'));
    if(target) setTimeout(function(){ target.scrollIntoView({behavior:'smooth',block:'start'}); },300);
  }
})();
</script>
